name = "bookspdf-api"
main = "src/index.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# Non-secret configuration. Safe to commit.
# Everything that IS secret (connection strings, API keys, JWT secret, admin
# password, PhonePe credentials) must be set with `wrangler secret put NAME`
# instead — see README.md "Deploying" section. Do not put secrets here.
# ---------------------------------------------------------------------------
[vars]
NODE_ENV = "production"
JWT_EXPIRE = "7h"
FRONTEND_URL = "https://booksnpdf.com"
EMAIL_USER = "contact@booksnpdf.com"
PHONEPE_CLIENT_VERSION = "1"
ADMIN_EMAIL= "admin@bookmarket.com"

# Uncomment and adjust if you split traffic across environments.
# [env.staging]
# vars = { NODE_ENV = "staging", FRONTEND_URL= "http://localhost:4321" }

# Workers Logs (optional but recommended for debugging webhook/payment issues)
[observability]
enabled = true
