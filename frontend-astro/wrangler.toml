name = "bookspdf-astro"
compatibility_date = "2026-07-25"
compatibility_flags = ["nodejs_compat"]

main = "./dist/_worker.js/index.js"

[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
# Backend API base URL — this is the backend-workers/ Worker, deployed
# separately on Cloudflare (its own `wrangler deploy`, its own subdomain or
# custom domain). Set these to that Worker's URL once it's deployed, or
# override them in the Cloudflare dashboard under
# Workers & Pages > Settings > Variables.
PUBLIC_API_URL = "https://your-backend-workers-subdomain.workers.dev/api"
API_URL = "https://your-backend-workers-subdomain.workers.dev/api"
PUBLIC_GOOGLE_CLIENT_ID = "your-google-oauth-client-id.apps.googleusercontent.com"

# --- Optional: per-environment overrides ---
# [env.staging.vars]
# PUBLIC_API_URL = "https://staging-api.booksnpdf.com/api"
# API_URL = "https://staging-api.booksnpdf.com/api"

# If you later add KV, D1, or R2 bindings, they go here, e.g.:
# [[kv_namespaces]]
# binding = "MY_KV"
# id = "xxxxxxxx"
