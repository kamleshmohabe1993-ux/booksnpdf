name = "bookspdf-astro"
compatibility_date = "2026-07-25"
compatibility_flags = ["nodejs_compat"]

main = "./dist/_worker.js/index.js"

[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
# Backend API base URL (Express server — deployed separately, NOT on
# Cloudflare; see backend/README notes). Override this per-environment
# below, or set it in the Cloudflare dashboard under
# Workers & Pages > Settings > Variables.
PUBLIC_API_URL = "https://your-backend-domain.com/api"
API_URL = "https://your-backend-domain.com/api"
PUBLIC_GOOGLE_CLIENT_ID = "your-google-oauth-client-id.apps.googleusercontent.com"

# --- Optional: per-environment overrides ---
# [env.staging.vars]
# PUBLIC_API_URL = "https://staging-api.bookspdf.com/api"
# API_URL = "https://staging-api.bookspdf.com/api"

# If you later add KV, D1, or R2 bindings, they go here, e.g.:
# [[kv_namespaces]]
# binding = "MY_KV"
# id = "xxxxxxxx"
